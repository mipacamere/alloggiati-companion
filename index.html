<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alloggiati Companion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1> Alloggiati Companion</h1>
        <p>Generatore file TXT per portale Polizia di Stato</p>
    </header>

    <main>
        <!-- Sezione Configurazione -->
        <section id="config-section">
            <h2>⚙️ Configurazione</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="date-filter">Data di arrivo:</label>
                    <select id="date-filter">
                        <option value="today">Oggi</option>
                        <option value="yesterday">Ieri</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="structure-filter">Struttura:</label>
                    <select id="structure-filter">
                        <option value="">-- Seleziona struttura --</option>
                        <option value="ME001066">Via Nazionale (ME001066)</option>
                        <option value="ME006995">MiPA (ME006995)</option>
                    </select>
                </div>
            </div>
            
            <button id="btn-load" class="btn btn-primary">📥 Carica Dati</button>
<div class="import-section" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee;">
  <p style="font-size: 0.9em; color: #666; margin-bottom: 8px;">Oppure importa da file locale (TXT/CSV):</p>
  <input type="file" id="txt-file-input" accept=".txt,.csv,.tsv" style="display: none;" />
  <button type="button" id="btn-import-txt" class="btn btn-secondary" onclick="document.getElementById('txt-file-input').click()">
    📂 Importa da TXT/CSV
  </button>
  <span id="txt-file-name" style="margin-left: 10px; font-size: 0.85em; color: #555;"></span>
</div>
        </section>

        <!-- Sezione Lista Ospiti -->
        <section id="guest-list-section" class="hidden">
            <div class="stats">
                <div class="stat-card">
                    <span id="stat-total">0</span>
                    <small>Totale</small>
                </div>
                <div class="stat-card valid">
                    <span id="stat-selected">0</span>
                    <small>Selezionati</small>
                </div>
                <div class="stat-card error">
                    <span id="stat-excluded">0</span>
                    <small>Esclusi</small>
                </div>
            </div>

            <div class="actions-bar">
                <button id="btn-select-all" class="btn btn-small">✅ Seleziona Tutti</button>
                <button id="btn-deselect-all" class="btn btn-small"> Deseleziona Tutti</button>
            </div>

            <div id="guest-list"></div>

            <div class="actions">
                <button id="btn-generate" class="btn btn-primary" disabled>📄 Genera File TXT</button>
                <button id="btn-test" class="btn btn-secondary" disabled>🔎 Convalida con la Questura (Test)</button>
                <button id="btn-send" class="btn btn-danger" disabled>🚨 Invia REALMENTE alla Questura</button>
                <button id="btn-clear" class="btn btn-secondary">🗑️ Svuota Lista</button>
            </div>

            <div id="questura-result"></div>
        </section>

        <!-- Sezione Messaggi -->
        <div id="status" class="status hidden"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
